name: Wakey Wakey APK build
on:
  push:
    branches: [build/eye-open-alarm-20261118]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components using runner SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack Android project
        run: mkdir app-project && unzip -q Wakey-Wakey-v1.1.0-Source.zip -d app-project
      - name: Verify walking classifier (JDK)
        run: |
          mkdir -p /tmp/wakey-classes
          javac -d /tmp/wakey-classes app-project/app/src/main/java/com/wakeproof/app/WalkSignalFilter.java app-project/tests/WalkSignalFilterTest.java
          java -cp /tmp/wakey-classes com.wakeproof.app.WalkSignalFilterTest
      - name: Build installable debug APK
        working-directory: app-project
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK signature and contents
        run: |
          APK=app-project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Wakey-Wakey-v1.1.0-APK
          path: app-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
