name: Build Wakey Wakey APK
on:
  push:
    branches:
      - build/eye-open-alarm-20261118
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract Android project
        run: mkdir -p appsrc && tar -xJf src/wakey-src.tar.xz -C appsrc
      - name: Assemble debug APK
        working-directory: appsrc
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publish Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Wakey-Wakey-v1.2.0-APK
          path: appsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Announce run ID and status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BUILD_STATUS: ${{ job.status }}
        run: gh api "repos/$REPO/issues/1/comments" -f body="Wakey v1.2 build run $RUN_ID — $BUILD_STATUS"
