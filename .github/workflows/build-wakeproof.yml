name: WakeProof Android APK
on:
  push:
    branches:
      - build/eye-open-alarm-20261118
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Unpack app sources
        run: unzip -oq WakeProof-Source.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 35
        run: |
          SDKM=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        working-directory: WakeProof
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: WakeProof-debug-APK
          path: WakeProof/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish sources
        uses: actions/upload-artifact@v4
        with:
          name: WakeProof-source-code
          path: WakeProof-Source.zip
